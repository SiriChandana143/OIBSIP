spring:
  application:
    name: smartlib-ai
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smartlib_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:SmartLibAISuperSecretKeyForJWTTokenGeneration2024MustBe256BitsLong!!}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  fine-per-day: 5
  borrow-days: 14
  upload-dir: uploads/books

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.smartlib: INFO
    org.springframework.security: WARN
