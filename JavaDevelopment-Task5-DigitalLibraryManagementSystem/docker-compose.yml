version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: smartlib-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smartlib_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: smartlib-backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: smartlib_db
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: SmartLibAISuperSecretKeyForJWTTokenGeneration2024MustBe256BitsLong!!
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: smartlib-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
